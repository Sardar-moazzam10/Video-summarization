<script defer="" src="/static/js/bundle.js"></script><style>/**
 * Design Tokens - Recall.ai Inspired
 * Modern, premium dark theme with blue accents
 */

:root {
  /* ============================================
     BRAND COLORS (Recall.ai Inspired)
     ============================================ */
  --brand-50: #eef6ff;
  --brand-100: #d9ebff;
  --brand-200: #bcdeff;
  --brand-300: #8ecaff;
  --brand-400: #58adff;
  --brand-500: #478BE0;  /* Primary accent */
  --brand-600: #2F61A0;  /* Hover state */
  --brand-700: #1e4a7c;
  --brand-800: #1c3d5f;
  --brand-900: #1c3550;
  --brand-950: #000212;  /* Deep background */

  /* ============================================
     SURFACE COLORS
     ============================================ */
  --surface-base: #000212;
  --surface-elevated: #0a0f1a;
  --surface-card: #111827;
  --surface-overlay: rgba(17, 24, 39, 0.95);
  --surface-hover: rgba(71, 139, 224, 0.1);

  /* ============================================
     TEXT HIERARCHY
     ============================================ */
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-tertiary: rgba(255, 255, 255, 0.5);
  --text-muted: rgba(255, 255, 255, 0.3);
  --text-inverse: #000212;

  /* ============================================
     SEMANTIC COLORS
     ============================================ */
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.1);
  --warning: #f59e0b;
  --warning-bg: rgba(245, 158, 11, 0.1);
  --error: #ef4444;
  --error-bg: rgba(239, 68, 68, 0.1);
  --info: #3b82f6;
  --info-bg: rgba(59, 130, 246, 0.1);

  /* ============================================
     BORDERS & DIVIDERS
     ============================================ */
  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-default: rgba(255, 255, 255, 0.1);
  --border-strong: rgba(255, 255, 255, 0.2);
  --border-brand: rgba(71, 139, 224, 0.5);

  /* ============================================
     SHADOWS & GLOWS
     ============================================ */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
  --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 20px rgba(71, 139, 224, 0.3);
  --shadow-glow-strong: 0 0 40px rgba(71, 139, 224, 0.4);

  /* ============================================
     SPACING SCALE
     ============================================ */
  --space-1: 0.25rem;  /* 4px */
  --space-2: 0.5rem;   /* 8px */
  --space-3: 0.75rem;  /* 12px */
  --space-4: 1rem;     /* 16px */
  --space-5: 1.25rem;  /* 20px */
  --space-6: 1.5rem;   /* 24px */
  --space-8: 2rem;     /* 32px */
  --space-10: 2.5rem;  /* 40px */
  --space-12: 3rem;    /* 48px */
  --space-16: 4rem;    /* 64px */
  --space-20: 5rem;    /* 80px */

  /* ============================================
     BORDER RADIUS
     ============================================ */
  --radius-sm: 0.375rem;  /* 6px */
  --radius-md: 0.5rem;    /* 8px */
  --radius-lg: 0.75rem;   /* 12px */
  --radius-xl: 1rem;      /* 16px */
  --radius-2xl: 1.25rem;  /* 20px */
  --radius-3xl: 1.5rem;   /* 24px */
  --radius-full: 9999px;

  /* ============================================
     TYPOGRAPHY
     ============================================ */
  --font-sans: 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;     /* 12px */
  --text-sm: 0.875rem;    /* 14px */
  --text-base: 1rem;      /* 16px */
  --text-lg: 1.125rem;    /* 18px */
  --text-xl: 1.25rem;     /* 20px */
  --text-2xl: 1.5rem;     /* 24px */
  --text-3xl: 1.875rem;   /* 30px */
  --text-4xl: 2.25rem;    /* 36px */
  --text-5xl: 3rem;       /* 48px */
  --text-6xl: 3.75rem;    /* 60px */
  --text-7xl: 4.5rem;     /* 72px */

  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  /* ============================================
     TRANSITIONS
     ============================================ */
  --transition-fast: 150ms ease;
  --transition-normal: 300ms ease;
  --transition-slow: 500ms ease;
  --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ============================================
     Z-INDEX SCALE
     ============================================ */
  --z-dropdown: 10;
  --z-sticky: 20;
  --z-fixed: 30;
  --z-modal-backdrop: 40;
  --z-modal: 50;
  --z-popover: 60;
  --z-tooltip: 70;
}

/* ============================================
   GRADIENT UTILITIES
   ============================================ */
.gradient-text {
  background: linear-gradient(135deg, var(--brand-500) 0%, var(--text-primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.gradient-brand {
  background: linear-gradient(135deg, var(--brand-600) 0%, var(--brand-500) 100%);
}

.gradient-radial {
  background: radial-gradient(circle at center, var(--brand-500) 0%, transparent 70%);
}

.gradient-hero {
  background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(71, 139, 224, 0.3) 0%, transparent 100%);
}

/* ============================================
   GLASSMORPHISM
   ============================================ */
.glass {
  background: rgba(17, 24, 39, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
}

.glass-strong {
  background: rgba(17, 24, 39, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-default);
}

/* ============================================
   ANIMATIONS
   ============================================ */
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes pulseRing {
  0%, 100% {
    transform: scale(1);
    opacity: 0.5;
  }
  50% {
    transform: scale(1.5);
    opacity: 0;
  }
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.animate-slide-up {
  animation: slideUp 0.5s ease-out forwards;
}

.animate-fade-in {
  animation: fadeIn 0.3s ease-out forwards;
}

.animate-pulse-ring {
  animation: pulseRing 2s ease-in-out infinite;
}

.animate-gradient {
  background-size: 200% 200%;
  animation: gradientShift 3s ease infinite;
}

.animate-shimmer {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
}

.animate-float {
  animation: float 3s ease-in-out infinite;
}

.animate-spin {
  animation: spin 1s linear infinite;
}

/* Staggered animations */
.stagger-1 { animation-delay: 0.1s; }
.stagger-2 { animation-delay: 0.2s; }
.stagger-3 { animation-delay: 0.3s; }
.stagger-4 { animation-delay: 0.4s; }
.stagger-5 { animation-delay: 0.5s; }

/* Import Recall.ai-inspired design tokens */

/* Import Inter font */

:root {
  /* Primary Colors */
  --primary: #478BE0;
  --primary-light: #58adff;
  --primary-dark: #2F61A0;
  --secondary: #22c55e;

  /* Background Colors */
  --bg-dark: #000212;
  --bg-darker: #000212;
  --bg-card: #111827;
  --bg-alt: #1e293b;
  --bg-hover: rgba(71, 139, 224, 0.1);

  /* Text Colors */
  --text-primary: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.4);

  /* Accents */
  --success: #22c55e;
  --warning: #f59e0b;
  --error: #ef4444;

  /* Shadows */
  --shadow-primary: rgba(71, 139, 224, 0.3);
  --shadow-primary-strong: rgba(71, 139, 224, 0.5);
  --shadow-card: 0 4px 6px rgba(0, 0, 0, 0.3);
  --shadow-card-hover: 0 12px 24px rgba(71, 139, 224, 0.15);
  --shadow-glow: 0 0 20px rgba(71, 139, 224, 0.3);

  /* Transitions */
  --transition-fast: 0.15s ease;
  --transition-normal: 0.3s ease;
  --transition-slow: 0.5s ease;

  /* Border Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  overflow-x: hidden;
}

code {

  width: 8px;
}

  background: rgba(255, 255, 255, 0.1);

  background-color: rgba(71, 139, 224, 0.3);

  text-align: center;
  min-height: 100vh;
  position: relative;
}

.ambient-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  transition: background 0.3s ease;
}

.App-logo {
  height: 40vmin;
  pointer-events: none;
  filter: drop-shadow(0 0 20px rgba(14, 165, 233, 0.3));
}

@media (prefers-reduced-motion: no-preference) {
  .App-logo {
    animation: App-logo-spin infinite 20s linear;
  }
}

.App-header {
  background-color: #0F172A;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: calc(10px + 2vmin);
  color: #F8FAFC;
  position: relative;
  overflow: hidden;
}

.App-header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.1) 0%, transparent 70%);
  pointer-events: none;
}

.App-link {
  color: #0EA5E9;
  transition: color var(--transition-normal);
  text-decoration: none;
}

.App-link:hover {
  color: #38BDF8;
  text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
}

@keyframes App-logo-spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

/* Video Card Styling */
.video-card {
  border: 1px solid #334155;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  transition: all var(--transition-normal);
  background-color: #1E293B;
  position: relative;
  backdrop-filter: blur(10px);
}

.video-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.05) 0%, transparent 100%);
  opacity: 0;
  transition: opacity var(--transition-normal);
  pointer-events: none;
  z-index: 1;
}

.video-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: var(--shadow-card-hover);
  border-color: rgba(14, 165, 233, 0.5);
}

.video-card:hover::before {
  opacity: 1;
}

.video-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  transition: transform var(--transition-slow);
}

.video-card:hover img {
  transform: scale(1.05);
}

.video-card h3 {
  font-size: 18px;
  margin: 10px;
  color: #F8FAFC;
  font-weight: 600;
  line-height: 1.4;
}

.video-card p {
  font-size: 14px;
  color: #94A3B8;
  margin: 10px;
  line-height: 1.5;
}

.watch-button {
  display: block;
  text-align: center;
  background: linear-gradient(135deg, #0EA5E9, #0284C7);
  color: white;
  padding: 12px 20px;
  margin: 10px;
  text-decoration: none;
  border-radius: var(--radius-sm);
  transition: all var(--transition-normal);
  font-weight: 600;
  position: relative;
  overflow: hidden;
  z-index: 2;
}

.watch-button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left var(--transition-slow);
}

.watch-button:hover {
  background: linear-gradient(135deg, #38BDF8, #0EA5E9);
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
}

.watch-button:hover::before {
  left: 100%;
}

/* Video List Styling */
.video-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 24px;
  padding: 24px;
  max-width: 1400px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .video-list {
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 16px;
  }
}

.nav-bar {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(calc(-50% + 32px));
  z-index: 1000;
  width: 90%;
  max-width: 1000px;
  padding: 0 8px;
  background: rgba(0, 2, 18, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-bar.nav-scrolled {
  background: rgba(0, 2, 18, 0.9);
  border-color: rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  padding: 0 12px;
}

/* Logo */
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.2s;
}

.nav-logo:hover {
  opacity: 0.8;
}

.nav-logo-img {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  object-fit: contain;
}

.nav-logo-text {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
}

/* Center Nav Links */
.nav-links {
  display: flex;
  align-items: center;
  gap: 2px;
}

.nav-link {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.5);
  font-size: 13.5px;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  font-family: inherit;
}

.nav-link:hover {
  color: rgba(255, 255, 255, 0.9);
  background: rgba(255, 255, 255, 0.06);
}

.nav-link-active {
  color: #fff;
  background: rgba(71, 139, 224, 0.12);
}

/* Right Actions */
.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.nav-btn-primary {
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border: none;
  padding: 8px 18px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  box-shadow: 0 2px 10px rgba(71, 139, 224, 0.25);
}

.nav-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(71, 139, 224, 0.35);
}

/* User Button */
.nav-user-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 5px 12px 5px 5px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  color: #fff;
}

.nav-user-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.12);
}

.nav-avatar {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
}

.nav-username {
  font-size: 13px;
  font-weight: 500;
  max-width: 100px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-chevron {
  transition: transform 0.2s;
  opacity: 0.5;
}

.nav-chevron-open {
  transform: rotate(180deg);
}

/* Dropdown */
.nav-dropdown-wrap {
  position: relative;
}

.nav-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 200px;
  background: rgba(17, 24, 39, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  z-index: 100;
}

.nav-dropdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.7);
  font-size: 13.5px;
  font-weight: 500;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
}

.nav-dropdown-item:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
}

.nav-dropdown-item svg {
  opacity: 0.6;
  flex-shrink: 0;
}

.nav-dropdown-divider {
  height: 1px;
  background: rgba(255, 255, 255, 0.06);
  margin: 4px 8px;
}

.nav-dropdown-danger {
  color: #ef4444;
}

.nav-dropdown-danger:hover {
  background: rgba(239, 68, 68, 0.1);
  color: #ef4444;
}

/* Nav link using <a> tag (updated to Link) */
.nav-link {

}

.nav-link--desktop {

  font-size: 13.5px;

  padding: 8px 14px;
  border-radius: 10px;

.nav-mobile-close:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}

.nav-mobile-links {
  flex: 1 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 16px 12px;
  overflow-y: auto;
}

.nav-mobile-link {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-radius: 12px;
  color: rgba(255,255,255,0.6);
  font-size: 15px;
  font-weight: 500;
  text-decoration: none;
  transition: all 0.2s;
}
.nav-mobile-link:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
}
.nav-mobile-link--active {
  background: rgba(71,139,224,0.12);
  color: #478BE0;
}

.nav-mobile-footer {
  padding: 16px 16px 32px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.nav-mobile-user {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px 16px;
}

.nav-avatar--lg {
  width: 40px !important;
  height: 40px !important;
  font-size: 16px !important;
}

.nav-mobile-username {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin: 0;
}
.nav-mobile-role {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  margin: 2px 0 0;
  text-transform: capitalize;
}

.nav-mobile-auth-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 13px 16px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  font-family: inherit;
  border: none;
  transition: all 0.2s;
  text-align: center;
}
.nav-mobile-auth-btn--ghost {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8);
}
.nav-mobile-auth-btn--ghost:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
}
.nav-mobile-auth-btn--primary {
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  box-shadow: 0 2px 10px rgba(71,139,224,0.3);
}
.nav-mobile-auth-btn--danger {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.2);
  color: #f87171;
}
.nav-mobile-auth-btn--danger:hover {
  background: rgba(239,68,68,0.15);
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 768px) {
  .nav-bar {
    width: 95%;
    top: 10px;
  }

  .nav-links {
    display: none;
  }

  .nav-username {
    display: none;
  }

  .nav-inner {
    height: 50px;
  }

  .nav-hamburger {
    display: flex;
  }

  .nav-link--desktop,
  .nav-btn-primary--desktop {
    display: none;
  }
}

   CHOICE PAGE v2 — Premium Redesign (cp- prefix)
   ============================================ */

/* ── Base ── */
.cp {
  background: #000212;
  color: #fff;
  min-height: 100vh;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  position: relative;
}

/* ── Background System ── */
.cp-orb {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.cp-orb--blue {
  top: -12%;
  right: -8%;
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, rgba(71,139,224,0.13) 0%, transparent 65%);
  filter: blur(90px);
}
.cp-orb--violet {
  bottom: 15%;
  left: -12%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(139,92,246,0.09) 0%, transparent 65%);
  filter: blur(100px);
}
.cp-orb--teal {
  top: 55%;
  right: 5%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 65%);
  filter: blur(80px);
}
.cp-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(71,139,224,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(71,139,224,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, black, transparent);
  pointer-events: none;
  z-index: 0;
}
.cp-hero,
.cp-trust,
.cp-features,
.cp-how,
.cp-cta { position: relative; z-index: 1; }

/* ── Typography Tokens ── */
.cp-gradient-text {
  background: linear-gradient(135deg, #478BE0 0%, #60b3ff 45%, #a5d4ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.cp-eyebrow {
  display: inline-block;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #478BE0;
  margin-bottom: 12px;
}
.cp-h2 {
  font-size: 2.8rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: #fff;
  margin: 0 0 14px;
  line-height: 1.1;
}
.cp-h2-sub {
  font-size: 1.05rem;
  color: rgba(255,255,255,0.42);
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.65;
}
.cp-section-head {
  text-align: center;
  margin-bottom: 56px;
}

/* ── Badge ── */
.cp-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px 7px 11px;
  border-radius: 9999px;
  background: rgba(71,139,224,0.08);
  border: 1px solid rgba(71,139,224,0.22);
  font-size: 13px;
  font-weight: 500;
  color: #7ab8f5;
  margin-bottom: 28px;
  width: fit-content;
}
.cp-badge-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #478BE0;
  animation: cpBadgePulse 2.2s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes cpBadgePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(71,139,224,0); opacity: 1; }
  50% { box-shadow: 0 0 0 5px rgba(71,139,224,0.12); opacity: 0.75; }
}

/* ── HERO ── */
.cp-hero {
  display: flex;
  align-items: center;
  gap: 64px;
  padding: 132px 56px 88px;
  max-width: 1300px;
  margin: 0 auto;
  min-height: 100vh;
}
.cp-hero-left {
  flex: 1 1;
  max-width: 600px;
}
.cp-h1 {
  font-size: 4.4rem;
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.04em;
  color: #fff;
  margin: 0 0 22px;
}
.cp-h1-gradient {
  display: block;
  margin-top: 4px;
}
.cp-cursor {
  display: inline-block;
  width: 3px;
  height: 0.8em;
  background: #478BE0;
  margin-left: 3px;
  vertical-align: text-bottom;
  animation: cpBlink 0.85s step-end infinite;
}
@keyframes cpBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.cp-hero-desc {
  font-size: 1.1rem;
  line-height: 1.75;
  color: rgba(255,255,255,0.48);
  margin: 0 0 36px;
  max-width: 500px;
}

/* ── Buttons ── */
.cp-hero-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 52px;
}
.cp-btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 15px 28px;
  background: linear-gradient(135deg, #4e95ec, #2c5da6);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
  box-shadow: 0 4px 20px rgba(71,139,224,0.32), 0 0 0 1px rgba(71,139,224,0.25);
}
.cp-btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 36px rgba(71,139,224,0.42), 0 0 70px rgba(71,139,224,0.12);
}
.cp-btn-shimmer {
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: cpShimmer 2.6s ease-in-out infinite;
}
@keyframes cpShimmer {
  0% { background-position: 200% center; }
  100% { background-position: -200% center; }
}
.cp-btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 15px 22px;
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.62);
  font-size: 15px;
  font-weight: 500;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.22s;
}
.cp-btn-ghost:hover {
  background: rgba(255,255,255,0.09);
  color: #fff;
  border-color: rgba(255,255,255,0.2);
  transform: translateY(-1px);
}

/* ── Stats ── */
.cp-stats {
  display: flex;
  align-items: center;
  gap: 0;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.07);
  flex-wrap: wrap;
}
.cp-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-right: 28px;
  margin-right: 28px;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.cp-stat:last-child { border-right: none; padding-right: 0; margin-right: 0; }
.cp-stat-icon { font-size: 16px; margin-bottom: 2px; }
.cp-stat-value { font-size: 1.35rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
.cp-stat-label { font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

/* ── Hero Visual Card ── */
.cp-hero-right { flex-shrink: 0; width: 430px; }
.cp-visual-card {
  background: rgba(10,14,26,0.88);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow:
    0 0 0 1px rgba(71,139,224,0.12),
    0 28px 80px rgba(0,0,0,0.65),
    0 0 120px rgba(71,139,224,0.05),
    inset 0 1px 0 rgba(255,255,255,0.05);
}
.cp-card-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(255,255,255,0.02);
}
.cp-card-dots { display: flex; gap: 6px; }
.cp-card-dots span { width: 10px; height: 10px; border-radius: 50%; }
.cp-card-dots span:nth-child(1) { background: rgba(239,68,68,0.75); }
.cp-card-dots span:nth-child(2) { background: rgba(245,158,11,0.75); }
.cp-card-dots span:nth-child(3) { background: rgba(34,197,94,0.75); }
.cp-card-bar-title { font-size: 11.5px; color: rgba(255,255,255,0.32); font-weight: 500; }
.cp-card-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  padding: 20px 22px;
}

/* Thumbnails */
.cp-thumbs { display: flex; gap: 10px; width: 100%; }
.cp-thumb {
  flex: 1 1;
  min-height: 88px;
  border-radius: 10px;
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  border: 1px solid rgba(255,255,255,0.07);
  position: relative;
  overflow: hidden;
}
.cp-thumb--blue   { background: linear-gradient(135deg, rgba(71,139,224,0.18), rgba(56,189,248,0.06)); }
.cp-thumb--violet { background: linear-gradient(135deg, rgba(139,92,246,0.18), rgba(167,139,250,0.06)); }
.cp-thumb--emerald{ background: linear-gradient(135deg, rgba(16,185,129,0.18), rgba(52,211,153,0.06)); }
.cp-thumb-play { width: 20px; height: 20px; border-radius: 5px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.4); margin-bottom: 2px; }
.cp-thumb-title { font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp-thumb-src { font-size: 8px; color: rgba(255,255,255,0.28); }
.cp-thumb-dur { margin-top: auto; font-size: 8px; font-weight: 700; padding: 2px 5px; border-radius: 4px; font-family: monospace; }
.cp-thumb-dur--blue   { background: rgba(71,139,224,0.15); color: #58adff; border: 1px solid rgba(71,139,224,0.2); }
.cp-thumb-dur--violet { background: rgba(139,92,246,0.15); color: #c084fc; border: 1px solid rgba(139,92,246,0.2); }
.cp-thumb-dur--emerald{ background: rgba(16,185,129,0.15); color: #4ade80; border: 1px solid rgba(16,185,129,0.2); }
.cp-thumb-check { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 50%; background: rgba(34,197,94,0.9); display: flex; align-items: center; justify-content: center; color: #fff; }

/* Total input label */
.cp-total-input { display: flex; align-items: center; gap: 5px; font-size: 10px; color: rgba(255,255,255,0.28); align-self: flex-start; }
.cp-total-input strong { color: rgba(255,255,255,0.5); font-weight: 600; }

/* Compression */
.cp-compress {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 12px;
  background: rgba(71,139,224,0.04);
  border: 1px solid rgba(71,139,224,0.1);
  border-radius: 12px;
}
.cp-funnel { position: relative; width: 100px; height: 48px; display: flex; align-items: flex-end; justify-content: center; }
.cp-funnel--done { animation: cpFunnelPulse 0.8s ease-out; }
@keyframes cpFunnelPulse {
  0%  { filter: drop-shadow(0 0 0px rgba(71,139,224,0)); }
  40% { filter: drop-shadow(0 0 12px rgba(71,139,224,0.65)); }
  100%{ filter: drop-shadow(0 0 0px rgba(71,139,224,0)); }
}
.cp-funnel-svg { position: absolute; bottom: 0; left: 0; }
.cp-streams { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; padding: 0 10px; }
.cp-stream { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; overflow: hidden; }
.cp-dot { width: 3px; height: 3px; border-radius: 50%; background: #478BE0; opacity: 0; animation: cpDotFlow 1.4s ease-in infinite; }
.cp-dot--d1 { animation-delay: 0.45s; }
.cp-dot--d2 { animation-delay: 0.9s; }
@keyframes cpDotFlow {
  0%  { opacity: 0; transform: translateY(0); }
  20% { opacity: 0.9; transform: translateY(4px); }
  80% { opacity: 0.6; transform: translateY(28px); }
  100%{ opacity: 0; transform: translateY(40px); }
}
.cp-compress-time { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 700; }
.cp-compress-from { font-size: 12px; color: rgba(255,255,255,0.28); text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.15); }
.cp-compress-time svg { color: rgba(71,139,224,0.5); flex-shrink: 0; }
.cp-compress-to { font-size: 15px; color: rgba(255,255,255,0.25); transition: color 0.5s ease; letter-spacing: -0.02em; }
.cp-compress-to.done { color: #58adff; text-shadow: 0 0 18px rgba(71,139,224,0.55); animation: cpTimeReveal 0.4s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes cpTimeReveal {
  from { opacity: 0; transform: scale(0.85) translateY(4px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.cp-compress-badge { font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 9999px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.25); transition: all 0.4s ease; }
.cp-compress-badge.active { background: rgba(71,139,224,0.1); border-color: rgba(71,139,224,0.25); color: #58adff; }

/* Pipeline */
.cp-pipeline-wrap { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.cp-pipeline-track { width: 100%; height: 2px; background: rgba(255,255,255,0.06); border-radius: 1px; overflow: hidden; }
.cp-pipeline-fill { height: 100%; background: linear-gradient(90deg, #478BE0, #8ecaff); border-radius: 1px; transition: width 1.3s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 6px rgba(71,139,224,0.5); }
.cp-pipeline { display: flex; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.cp-stage { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.cp-stage-dot { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; transition: all 0.4s ease; }
.cp-stage-label { font-size: 8.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; transition: color 0.4s; white-space: nowrap; }
.cp-stage-line { width: 11px; height: 2px; border-radius: 1px; margin-top: 12px; flex-shrink: 0; transition: background 0.4s; }
.cp-stage--idle  .cp-stage-dot { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.2); }
.cp-stage--idle  .cp-stage-label { color: rgba(255,255,255,0.2); }
.cp-stage-line--idle { background: rgba(255,255,255,0.07); }
.cp-stage--active .cp-stage-dot { background: #478BE0; color: #fff; box-shadow: 0 0 12px rgba(71,139,224,0.65); animation: cpStagePulse 1.5s ease-in-out infinite; }
.cp-stage--active .cp-stage-label { color: #58adff; }
@keyframes cpStagePulse {
  0%, 100% { box-shadow: 0 0 8px rgba(71,139,224,0.4); }
  50% { box-shadow: 0 0 18px rgba(71,139,224,0.75); }
}
.cp-stage--done .cp-stage-dot { background: rgba(34,197,94,0.88); color: #fff; }
.cp-stage--done .cp-stage-label { color: rgba(255,255,255,0.3); }
.cp-stage-line--done { background: rgba(34,197,94,0.45); }

/* Output */
.cp-output { width: 100%; padding: 13px 15px; background: rgba(71,139,224,0.06); border: 1px solid rgba(71,139,224,0.12); border-radius: 12px; display: flex; flex-direction: column; gap: 10px; transition: all 0.5s ease; }
.cp-output--done { border-color: rgba(34,197,94,0.22); background: rgba(34,197,94,0.05); }
.cp-output-row { display: flex; align-items: center; gap: 8px; }
.cp-output-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: cpBadgePulse 2s ease-in-out infinite; flex-shrink: 0; }
.cp-output-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.65); }
.cp-output-tag { font-size: 9px; padding: 1px 6px; border-radius: 4px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.15); color: rgba(34,197,94,0.85); font-weight: 600; animation: cpReveal 0.4s ease-out both; }
.cp-output-time { margin-left: auto; font-size: 11px; font-weight: 700; color: #478BE0; font-family: monospace; }
.cp-output-score { font-size: 10px; color: rgba(88,173,255,0.75); font-weight: 500; animation: cpReveal 0.4s ease-out both; }
@keyframes cpReveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.cp-waveform { display: flex; align-items: center; gap: 2px; height: 20px; }
.cp-wave-bar { width: 3px; background: linear-gradient(to top, #478BE0, #8ecaff); border-radius: 1.5px; min-height: 3px; opacity: 0.65; }
.cp-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.cp-pill { padding: 3px 9px; border-radius: 9999px; background: rgba(71,139,224,0.09); border: 1px solid rgba(71,139,224,0.15); font-size: 10px; color: #58adff; font-weight: 500; }

/* ── Redesigned Hero Card ── */

/* Input source list */
.cp-card-sources {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
}
.cp-src-row { display: flex; align-items: center; gap: 10px; }
.cp-src-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cp-src-label { flex: 1 1; font-size: 12.5px; color: rgba(255,255,255,0.5); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp-src-dur { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.22); font-family: 'JetBrains Mono','Fira Code',monospace; flex-shrink: 0; }

/* AI Processing scanning divider */
.cp-ai-divider { width: 100%; display: flex; align-items: center; gap: 10px; }
.cp-ai-scan-line {
  flex: 1 1; height: 1px;
  background: rgba(71,139,224,0.12);
  position: relative; overflow: hidden; border-radius: 1px;
}
.cp-ai-scan-line::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(71,139,224,0.75), transparent);
  animation: cpLineScan 2.5s ease-in-out infinite;
}
.cp-ai-scan-line--rev::after { animation-direction: reverse; }
.cp-ai-label { font-size: 9.5px; font-weight: 700; color: rgba(71,139,224,0.45); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
@keyframes cpLineScan { 0% { transform: translateX(-120%); } 100% { transform: translateX(220%); } }

/* Hero compression metric */
.cp-transform-hero { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px 0 4px; width: 100%; }
.cp-transform-from,
.cp-transform-to { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 80px; }
.cp-transform-dur { font-size: 2rem; font-weight: 800; letter-spacing: -0.05em; line-height: 1; display: block; }
.cp-transform-from .cp-transform-dur { color: rgba(255,255,255,0.18); transition: color 0.6s cubic-bezier(0.22,1,0.36,1), text-shadow 0.6s ease; }
.cp-transform-to .cp-transform-dur { color: rgba(255,255,255,0.12); transition: color 0.6s cubic-bezier(0.22,1,0.36,1), text-shadow 0.6s ease; }
.cp-transform-from--done .cp-transform-dur,
.cp-transform-to--done .cp-transform-dur {
  color: #58adff;
  text-shadow: 0 0 24px rgba(71,139,224,0.55), 0 0 48px rgba(71,139,224,0.15);
  animation: cpMetricReveal 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes cpMetricReveal { from { opacity: 0; transform: scale(0.82) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.cp-transform-sub { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.18); }
.cp-transform-arrow-wrap { opacity: 0.4; flex-shrink: 0; }

/* Transform saving badge */
.cp-transform-badge {
  font-size: 12px; font-weight: 500; padding: 5px 16px;
  border-radius: 9999px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.22); transition: all 0.5s ease; text-align: center;
}
.cp-transform-badge--done {
  background: rgba(71,139,224,0.1); border-color: rgba(71,139,224,0.22);
  color: #58adff; box-shadow: 0 0 20px rgba(71,139,224,0.1);
}

/* Card output pills */
.cp-card-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 14px 0 0; width: 100%; border-top: 1px solid rgba(255,255,255,0.05); }
.cp-card-pill { padding: 5px 12px; border-radius: 9999px; background: rgba(71,139,224,0.07); border: 1px solid rgba(71,139,224,0.14); font-size: 11px; color: rgba(88,173,255,0.65); font-weight: 500; }

/* ── TRUST BAR ── */
.cp-trust {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 36px 48px;
  border-top: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(255,255,255,0.012);
}
.cp-trust-label { font-size: 11.5px; font-weight: 600; color: rgba(255,255,255,0.22); text-transform: uppercase; letter-spacing: 0.1em; margin: 0; }
.cp-trust-logos { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; justify-content: center; }
.cp-trust-logo { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.28); transition: color 0.2s; cursor: default; }
.cp-trust-logo:hover { color: rgba(255,255,255,0.5); }
.cp-trust-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(71,139,224,0.5); flex-shrink: 0; }

/* ── FEATURES ── */
.cp-features { padding: 100px 56px; max-width: 1200px; margin: 0 auto; }
.cp-features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }

.cp-feature-card {
  padding: 28px;
  background: rgba(10,15,28,0.7);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
}
.cp-feature-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 20% 15%, rgba(var(--accent-rgb), 0.07), transparent 55%);
  opacity: 0;
  transition: opacity 0.4s;
}
.cp-feature-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), 0.45), transparent);
  opacity: 0;
  transition: opacity 0.4s;
}
.cp-feature-card:hover { border-color: rgba(var(--accent-rgb), 0.28); transform: translateY(-4px); box-shadow: 0 20px 56px rgba(0,0,0,0.4), 0 0 32px rgba(var(--accent-rgb), 0.07); }
.cp-feature-card:hover::before,
.cp-feature-card:hover::after { opacity: 1; }

.cp-fc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cp-fc-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--icon-bg); display: flex; align-items: center; justify-content: center; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), 0.18); }
.cp-fc-tag { font-size: 11px; font-weight: 600; color: var(--accent); background: rgba(var(--accent-rgb), 0.1); border: 1px solid rgba(var(--accent-rgb), 0.2); padding: 3px 10px; border-radius: 9999px; }
.cp-fc-title { font-size: 1.2rem; font-weight: 700; color: #fff; margin: 0 0 8px; letter-spacing: -0.02em; }
.cp-fc-desc { font-size: 0.875rem; line-height: 1.65; color: rgba(255,255,255,0.42); margin: 0 0 18px; }
.cp-fc-cta { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--accent); transition: gap 0.25s; margin-top: auto; }
.cp-feature-card:hover .cp-fc-cta { gap: 10px; }

/* Preview elements */
.cp-preview {
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 18px;
}

/* Search preview */
.cp-preview--search {
  padding: 12px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.07);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cp-preview-bar {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  background: rgba(71,139,224,0.08);
  border: 1px solid rgba(71,139,224,0.2);
  border-radius: 8px;
  font-size: 11.5px;
  color: rgba(255,255,255,0.45);
}
.cp-preview-bar svg { color: rgba(71,139,224,0.6); flex-shrink: 0; }
.cp-preview-rows { display: flex; flex-direction: column; gap: 5px; }
.cp-preview-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; background: rgba(255,255,255,0.03); font-size: 11px; color: rgba(255,255,255,0.5); }
.cp-preview-row-thumb { width: 24px; height: 16px; border-radius: 4px; flex-shrink: 0; }
.cp-preview-check { margin-left: auto; font-size: 10px; color: #22c55e; font-weight: 700; }

/* Keywords preview */
.cp-preview--pills {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 14px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.07);
}
.cp-preview-pill {
  padding: 5px 12px;
  border-radius: 9999px;
  font-size: 11.5px;
  font-weight: 500;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.4);
}
.cp-preview-pill.active {
  background: rgba(139,92,246,0.14);
  border-color: rgba(139,92,246,0.3);
  color: #c084fc;
}

/* Discover preview */
.cp-preview--discover {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 12px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.07);
}
.cp-preview-topics { display: flex; gap: 6px; overflow: hidden; }
.cp-preview-topic { padding: 4px 10px; border-radius: 9999px; font-size: 10.5px; font-weight: 500; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); color: rgba(255,255,255,0.32); white-space: nowrap; }
.cp-preview-topic.active { background: rgba(16,185,129,0.14); border-color: rgba(16,185,129,0.3); color: #4ade80; }
.cp-preview-video-list { display: flex; gap: 8px; }
.cp-preview-video { flex: 1 1; display: flex; gap: 7px; padding: 6px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
.cp-preview-video-thumb { width: 28px; height: 20px; border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.cp-preview-video-meta { flex: 1 1; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.cp-preview-meta-line { height: 5px; background: rgba(255,255,255,0.12); border-radius: 3px; }
.cp-preview-meta-sub { height: 4px; background: rgba(255,255,255,0.06); border-radius: 3px; width: 60%; }

/* Transcript preview */
.cp-preview--transcript {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 12px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,255,255,0.07);
}
.cp-preview-url { font-size: 10px; color: rgba(245,158,11,0.6); font-family: monospace; padding: 3px 8px; background: rgba(245,158,11,0.06); border-radius: 5px; }
.cp-preview-lines { display: flex; flex-direction: column; gap: 5px; }
.cp-preview-line { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); }
.cp-preview-lang { font-size: 10px; color: rgba(255,255,255,0.28); }

/* ── HOW IT WORKS ── */
.cp-how { padding: 80px 56px 100px; max-width: 1100px; margin: 0 auto; }
.cp-steps {
  display: flex;
  align-items: center;
  gap: 0;
  justify-content: center;
}
.cp-step {
  flex: 1 1;
  max-width: 320px;
  text-align: center;
  padding: 40px 28px;
  background: rgba(10,15,28,0.6);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  position: relative;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}
.cp-step:hover { border-color: rgba(var(--step-rgb), 0.22); transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.35), 0 0 24px rgba(var(--step-rgb), 0.08); }
.cp-step-num { position: absolute; top: 12px; right: 18px; font-size: 3rem; font-weight: 900; color: rgba(255,255,255,0.04); line-height: 1; pointer-events: none; }
.cp-step-icon { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; transition: box-shadow 0.3s; }
.cp-step:hover .cp-step-icon { box-shadow: 0 0 24px rgba(var(--step-rgb), 0.28); }
.cp-step-title { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0 0 10px; letter-spacing: -0.01em; }
.cp-step-desc { font-size: 0.875rem; line-height: 1.65; color: rgba(255,255,255,0.4); margin: 0; }
.cp-step-arrow { display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }

/* ── CTA ── */
.cp-cta { padding: 100px 56px 130px; text-align: center; position: relative; overflow: hidden; }
.cp-cta-orb { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(100px); }
.cp-cta-orb--1 { top: -30%; left: 25%; width: 600px; height: 500px; background: radial-gradient(circle, rgba(71,139,224,0.14), transparent 70%); }
.cp-cta-orb--2 { bottom: -30%; right: 15%; width: 500px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.09), transparent 70%); }
.cp-cta-inner {
  position: relative;
  z-index: 1;
  max-width: 680px;
  margin: 0 auto;
  padding: 68px 52px;
  background: rgba(10,15,28,0.72);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 28px;
  backdrop-filter: blur(24px);
  box-shadow: 0 0 100px rgba(71,139,224,0.07), inset 0 1px 0 rgba(255,255,255,0.06);
}
.cp-cta-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: #478BE0;
  background: rgba(71,139,224,0.1);
  border: 1px solid rgba(71,139,224,0.22);
  padding: 5px 14px;
  border-radius: 9999px;
  margin-bottom: 24px;
}
.cp-cta-h2 { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; margin: 0 0 16px; line-height: 1.1; }
.cp-cta-desc { font-size: 1.05rem; color: rgba(255,255,255,0.42); margin: 0 0 36px; line-height: 1.65; }
.cp-cta-actions { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }

/* ── RESPONSIVE ── */
@media (max-width: 1050px) {
  .cp-hero { flex-direction: column; text-align: center; padding: 110px 28px 64px; gap: 48px; min-height: auto; }
  .cp-hero-left { max-width: 100%; }
  .cp-h1 { font-size: 3.4rem; }
  .cp-hero-desc { margin: 0 auto 36px; }
  .cp-hero-actions { justify-content: center; }
  .cp-stats { justify-content: center; }
  .cp-badge { margin: 0 auto 28px; }
  .cp-hero-right { width: 100%; max-width: 440px; }
  .cp-features { padding: 80px 28px; }
  .cp-features-grid { grid-template-columns: 1fr; }
  .cp-how { padding: 60px 28px 80px; }
  .cp-steps { flex-direction: column; align-items: stretch; gap: 16px; }
  .cp-step { max-width: 100%; }
  .cp-step-arrow { justify-content: center; padding: 0; transform: rotate(90deg); }
}

@media (max-width: 640px) {
  .cp-h1 { font-size: 2.6rem; }
  .cp-h2 { font-size: 2.2rem; }
  .cp-cta-h2 { font-size: 2.2rem; }
  .cp-hero { padding: 96px 20px 56px; }
  .cp-stats { flex-wrap: wrap; row-gap: 16px; }
  .cp-stat { border-right: none; padding-right: 0; }
  .cp-trust { padding: 28px 20px; }
  .cp-trust-logos { gap: 18px; }
  .cp-features { padding: 64px 20px; }
  .cp-how { padding: 56px 20px 72px; }
  .cp-cta { padding: 64px 20px 80px; }
  .cp-cta-inner { padding: 44px 24px; }
  .cp-cta-h2 { font-size: 1.9rem; }
  .cp-stage-line { width: 8px; }
}

   VIDEO CARD — Recall.ai Design System
   ============================================= */

.vc-card {
  background: rgba(17, 24, 39, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: border-color 0.25s, box-shadow 0.25s;
  position: relative;
  backdrop-filter: blur(12px);
  height: 100%;
}

.vc-card:hover {
  border-color: rgba(71, 139, 224, 0.25);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(71, 139, 224, 0.1);
}

.vc-card--selected {
  border-color: rgba(71, 139, 224, 0.6) !important;
  box-shadow: 0 0 0 3px rgba(71, 139, 224, 0.15), 0 12px 40px rgba(0, 0, 0, 0.5) !important;
}

/* Thumbnail */
.vc-thumb {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 */
  overflow: hidden;
  background: rgba(0, 0, 0, 0.3);
}

.vc-thumb-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.vc-card:hover .vc-thumb-img {
  transform: scale(1.04);
}

/* Play hint */
.vc-play-hint {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.35);
  color: #fff;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.vc-thumb:hover .vc-play-hint {
  opacity: 1;
}

/* Selection overlay */
.vc-select-overlay {
  position: absolute;
  inset: 0;
  background: rgba(71, 139, 224, 0.2);
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 10px;
  pointer-events: none;
}

.vc-check {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #478BE0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 2px 8px rgba(71, 139, 224, 0.5);
  flex-shrink: 0;
}

/* Body */
.vc-body {
  padding: 14px 16px 10px;
  flex: 1 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.vc-title {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  line-height: 1.45;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.vc-channel {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.4);
  margin: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.vc-desc {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.3);
  line-height: 1.5;
  margin: 4px 0 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Footer */
.vc-footer {
  padding: 10px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  margin-top: auto;
}

/* Select toggle button */
.vc-select-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  border: 1px dashed rgba(255, 255, 255, 0.15);
  background: transparent;
  color: rgba(255, 255, 255, 0.45);
}

.vc-select-btn:hover {
  border-color: rgba(71, 139, 224, 0.4);
  color: rgba(71, 139, 224, 0.9);
  background: rgba(71, 139, 224, 0.06);
}

.vc-select-btn--active {
  border-style: solid;
  border-color: rgba(71, 139, 224, 0.5);
  background: rgba(71, 139, 224, 0.12);
  color: #478BE0;
}

.vc-select-btn--active:hover {
  background: rgba(71, 139, 224, 0.2);
  border-color: rgba(71, 139, 224, 0.7);
}

/* Action buttons row */
.vc-actions {
  display: flex;
  gap: 8px;
}

.vc-btn {
  flex: 1 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  border: none;
  min-height: 36px;
}

.vc-btn--primary {
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  box-shadow: 0 2px 8px rgba(71, 139, 224, 0.25);
}

.vc-btn--primary:hover:not(:disabled) {
  box-shadow: 0 4px 16px rgba(71, 139, 224, 0.4);
  transform: translateY(-1px);
}

.vc-btn--primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.vc-btn--ghost {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.6);
}

.vc-btn--ghost:hover {
  background: rgba(255, 255, 255, 0.09);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.14);
}

/* Spinner */
.vc-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-top-color: #fff;
  border-radius: 50%;
  animation: vc-spin 0.65s linear infinite;
}

@keyframes vc-spin {
  to { transform: rotate(360deg); }
}

  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}

.suggested-topic-btn:hover {
  background: rgba(71,139,224,0.1);
  border-color: rgba(71,139,224,0.2);
  color: #fff;
}

.suggested-topic-btn.active {
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 2px 10px rgba(71,139,224,0.25);
}

/* Loading */
.suggested-loading {
  text-align: center;
  padding: 40px;
  color: rgba(255,255,255,0.45);
  font-size: 14px;
}

.suggested-error {
  text-align: center;
  color: #ef4444;
  font-size: 14px;
  padding: 20px;
}

/* Video grid — cards themselves now come from the shared VideoCard/VideoList
   component (src/VideoCard.css) so this page matches Search & Discover. */

/* Merge bar */
.suggested-merge-bar {
  margin-top: 32px;
  background: rgba(17,24,39,0.5);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.suggested-merge-text {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
}

.suggested-merge-select {
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  cursor: pointer;
}

.suggested-merge-select option {
  background: #111827;
}

.suggested-merge-btn {
  padding: 10px 22px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 2px 10px rgba(71,139,224,0.25);
  transition: all 0.2s;
}

.suggested-merge-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(71,139,224,0.35);
}

@media (max-width: 600px) {
  .suggested-container {
    padding: 90px 16px 40px;
  }

  .suggested-title {
    font-size: 26px;
  }

  .suggested-merge-bar {
    flex-direction: column;
    text-align: center;
  }
}

.summary-wrapper {
    text-align: center;
    /* Top padding clears the fixed 56px navbar (Navbar.css) — 50px clipped it. */
    padding: 110px 20px 60px;
    background: linear-gradient(-45deg, #0F172A, #1E293B, #0F172A, #1E293B);
    background-size: 400% 400%;
    animation: gradientAnimation 20s ease infinite, fadeIn 0.7s ease-in-out;
    min-height: 100vh;
    color: #ffffff;
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    position: relative;
  }
  
  @keyframes gradientAnimation {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }
  
  .summary-wrapper::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  
  .summary-title {
    font-size: 36px;
    margin-bottom: 35px;
    font-weight: 700;
    background: linear-gradient(135deg, #0EA5E9, #38BDF8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
    z-index: 1;
  }
  
  /* Responsive 16:9 player shell.
     react-youtube renders <div><iframe/></div>, so both are pinned to the
     wrapper — the iframe's own width/height attributes are then irrelevant. */
  .player-shell {
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    z-index: 1;
  }

  /* aspect-ratio fallback for older engines */
  @supports not (aspect-ratio: 16 / 9) {
    .player-shell::after {
      content: '';
      display: block;
      padding-bottom: 56.25%;
    }
  }

  .player-shell .player-frame,
  .player-shell > div {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .summary-subtitle {
    max-width: 620px;
    margin: -20px auto 32px;
    font-size: 15px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.5);
    position: relative;
    z-index: 1;
  }

  .summary-subtitle strong {
    color: #38BDF8;
    font-weight: 600;
  }

  /* Transcript snippet card — sits directly under the player.
     min-height reserves the space so hovering a timestamp never shifts layout. */
  .snippet-card {
    max-width: 900px;
    min-height: 96px;
    margin: 16px auto 0;
    padding: 18px 22px;
    text-align: left;
    background: rgba(30, 41, 59, 0.55);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.15);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: border-color var(--transition-normal), background var(--transition-normal);
    position: relative;
    z-index: 1;
  }

  .snippet-card.is-filled {
    border-color: rgba(56, 189, 248, 0.45);
    background: rgba(30, 41, 59, 0.75);
  }

  .snippet-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .snippet-time {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px;
    font-weight: 700;
    color: #0F172A;
    background: linear-gradient(135deg, #0EA5E9, #38BDF8);
    padding: 3px 10px;
    border-radius: 6px;
  }

  .snippet-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
  }

  .snippet-text {
    margin: 0;
    font-size: 16px;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.85);
    font-style: italic;
  }

  .snippet-mark {
    background: rgba(56, 189, 248, 0.22);
    color: #7DD3FC;
    padding: 0 3px;
    border-radius: 3px;
    font-weight: 600;
    font-style: normal;
  }

  .snippet-placeholder {
    margin: 0;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.3);
    font-style: normal;
  }

  .mention-count {
    display: inline-block;
    margin-left: 10px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 700;
    vertical-align: middle;
    color: #7DD3FC;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 9999px;
  }

  .video-switch-buttons {
    margin: 20px 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .video-btn {
    padding: 12px 24px;
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(14, 165, 233, 0.5);
    color: #38BDF8;
    font-weight: 600;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition-normal);
    position: relative;
    overflow: hidden;
  }
  
  .video-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }
  
  .video-btn:hover {
    background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(56, 189, 248, 0.2));
    border-color: #38BDF8;
    color: #fff;
    transform: scale(1.05) translateY(-2px);
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
  }
  
  .video-btn:hover::before {
    left: 100%;
  }
  
  .video-btn.active {
    background: linear-gradient(135deg, #0EA5E9, #38BDF8);
    border-color: #38BDF8;
    color: white;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.5);
  }
  
  .moment-title {
    margin-top: 45px;
    font-size: 28px;
    font-weight: 600;
    color: #38BDF8;
    position: relative;
    z-index: 1;
  }
  
  .timestamp-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 20px;
    animation: fadeInUp 0.8s ease;
    position: relative;
    z-index: 1;
  }
  
  .timestamp-btn {
    padding: 10px 20px;
    border: 2px solid rgba(14, 165, 233, 0.5);
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(10px);
    color: #ffffff;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition-normal);
    position: relative;
    overflow: hidden;
  }
  
  .timestamp-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }
  
  .timestamp-btn:hover {
    background: linear-gradient(135deg, #0EA5E9, #38BDF8);
    border-color: #38BDF8;
    color: #fff;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
  }
  
  .timestamp-btn:hover::before {
    left: 100%;
  }

  /* Committed selection — mirrors .video-btn.active so the two rows read alike. */
  .timestamp-btn.active {
    background: linear-gradient(135deg, #0EA5E9, #38BDF8);
    border-color: #38BDF8;
    color: #fff;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.5);
  }

  .timestamp-btn:focus-visible {
    outline: 2px solid #7DD3FC;
    outline-offset: 2px;
  }
  
  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }
  
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mobile */
  @media (max-width: 640px) {
    .summary-wrapper {
      padding: 96px 14px 48px;
    }

    .summary-title {
      font-size: 26px;
      margin-bottom: 24px;
    }

    .summary-subtitle {
      margin: -14px auto 24px;
      font-size: 14px;
    }

    .snippet-card {
      padding: 14px 16px;
      min-height: 88px;
    }

    .snippet-text {
      font-size: 15px;
    }

    .moment-title {
      margin-top: 32px;
      font-size: 21px;
    }

    .mention-count {
      display: block;
      width: fit-content;
      margin: 8px auto 0;
    }

    .video-btn,
    .timestamp-btn {
      padding: 10px 16px;
      font-size: 14px;
    }

    /* Touch devices keep hover transforms stuck after a tap */
    .video-btn:hover,
    .timestamp-btn:hover {
      transform: none;
    }
  }

   AUTH PAGES - Recall.ai Inspired
   ============================================ */

.auth-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000212;
  position: relative;
  padding: 40px 20px;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
}

.auth-bg-gradient {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(71, 139, 224, 0.08), transparent 70%);
  pointer-events: none;
}

.auth-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(71, 139, 224, 0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(71, 139, 224, 0.02) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black, transparent);
  pointer-events: none;
}

/* Card */
.auth-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  background: rgba(17, 24, 39, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  padding: 40px 36px;
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.auth-card-wide {
  max-width: 480px;
}

/* Logo */
.auth-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
  cursor: pointer;
}

.auth-logo-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(71, 139, 224, 0.1);
  border-radius: 10px;
  border: 1px solid rgba(71, 139, 224, 0.15);
}

.auth-logo-img {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  object-fit: contain;
}

.auth-logo-text {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
}

/* Headings */
.auth-heading {
  font-size: 1.75rem;
  font-weight: 700;
  color: #fff;
  margin: 0 0 6px;
  letter-spacing: -0.02em;
}

.auth-subheading {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.4);
  margin: 0 0 28px;
}

/* Form */
.auth-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.auth-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.auth-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.auth-label {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.6);
}

.auth-optional {
  font-weight: 400;
  color: rgba(255, 255, 255, 0.3);
}

.auth-label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.auth-forgot-link {
  font-size: 12.5px;
  color: #478BE0;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}

.auth-forgot-link:hover {
  color: #58adff;
}

/* Input */
.auth-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.auth-input-icon {
  position: absolute;
  left: 14px;
  color: rgba(255, 255, 255, 0.25);
  pointer-events: none;
  flex-shrink: 0;
}

.auth-input-wrap input {
  width: 100%;
  padding: 12px 14px;
  padding-left: 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s;
  outline: none;
}

.auth-input-icon + input {
  padding-left: 42px;
}

.auth-input-wrap input::placeholder {
  color: rgba(255, 255, 255, 0.25);
}

.auth-input-wrap input:focus {
  border-color: rgba(71, 139, 224, 0.5);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: 0 0 0 3px rgba(71, 139, 224, 0.1);
}

/* Browser autofill override — Chrome/Edge force a light background and dark
   text on saved/autofilled fields, which broke the dark theme and made the
   eye toggle nearly invisible. The inset box-shadow trick repaints the field
   with a solid dark color (autofill ignores `background`), and
   -webkit-text-fill-color keeps the typed text white. */
.auth-input-wrap input:-webkit-autofill,
.auth-input-wrap input:-webkit-autofill:hover,
.auth-input-wrap input:-webkit-autofill:focus,
.auth-input-wrap input:-webkit-autofill:active {
  -webkit-text-fill-color: #fff;
  caret-color: #fff;
  box-shadow: 0 0 0 1000px #1b2333 inset;
  /* Delay the autofill background swap effectively forever so it never
     flashes the light color. */
  -webkit-transition: background-color 9999s ease-in-out 0s;
  transition: background-color 9999s ease-in-out 0s;
}

/* Eye toggle button */
.auth-eye-btn {
  position: absolute;
  right: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.55);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: color 0.2s;
  flex-shrink: 0;
  z-index: 1;
}
.auth-eye-btn:hover {
  color: rgba(255, 255, 255, 0.9);
}

/* When eye button is present, add right padding to input */
.auth-input-wrap:has(.auth-eye-btn) input {
  padding-right: 40px;
}

/* Password strength meter */
.auth-strength {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
}
.auth-strength-bars {
  display: flex;
  gap: 4px;
  flex: 1 1;
}
.auth-strength-bar {
  flex: 1 1;
  height: 3px;
  border-radius: 3px;
}
.auth-strength-label {
  font-size: 11.5px;
  font-weight: 600;
  flex-shrink: 0;
}

/* Submit Button */
.auth-submit {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  box-shadow: 0 4px 16px rgba(71, 139, 224, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  margin-top: 4px;
}

.auth-submit:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(71, 139, 224, 0.35);
}

.auth-submit:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

/* Spinner */
.auth-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255, 255, 255, 0.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: auth-spin 0.6s linear infinite;
}

@keyframes auth-spin {
  to { transform: rotate(360deg); }
}

/* Messages */
.auth-message {
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 500;
  text-align: center;
}

.auth-message-success {
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.2);
  color: #4ade80;
}

.auth-message-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
}

/* Footer */
.auth-footer-text {
  text-align: center;
  margin-top: 24px;
  font-size: 13.5px;
  color: rgba(255, 255, 255, 0.4);
}

.auth-link {
  color: #478BE0;
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s;
}

.auth-link:hover {
  color: #58adff;
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 520px) {
  .auth-card {
    padding: 32px 24px;
  }

  .auth-row {
    grid-template-columns: 1fr;
  }

  .auth-heading {
    font-size: 1.5rem;
  }
