</style><style>/* ============================================
   PANEL PAGES - Recall.ai Inspired
   ============================================ */

.panel-page {
  min-height: 100vh;
  background: #000212;
  color: #fff;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  position: relative;
  overflow-x: hidden;
}

.panel-bg-gradient {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 50% 40% at 20% 50%, rgba(71, 139, 224, 0.04), transparent 70%);
  pointer-events: none;
}

.panel-layout {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ============================================
   SIDEBAR
   ============================================ */
.panel-sidebar {
  width: 260px;
  flex-shrink: 0;
  padding: 16px 16px 24px;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(17, 24, 39, 0.3);
}

.panel-sidebar-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  margin-bottom: 24px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.04);
  overflow: hidden;
}

.panel-sidebar-avatar {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.panel-sidebar-info {
  min-width: 0;
  flex: 1 1;
}

.panel-sidebar-name {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.panel-sidebar-email {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.35);
  margin: 2px 0 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.panel-sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.panel-sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 14px;
  background: none;
  border: none;
  border-radius: 10px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
}

.panel-sidebar-link:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.04);
}

.panel-sidebar-link-active {
  color: #fff;
  background: rgba(71, 139, 224, 0.12);
}

.panel-sidebar-link svg {
  opacity: 0.6;
  flex-shrink: 0;
}

.panel-sidebar-link-active svg {
  opacity: 1;
  color: #478BE0;
}

/* ============================================
   MAIN CONTENT
   ============================================ */
.panel-main {
  flex: 1 1;
  min-width: 0;
  padding: 90px 40px 32px;
  max-width: 700px;
}

.panel-heading {
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
  margin: 0 0 4px;
  letter-spacing: -0.02em;
}

.panel-subheading {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.4);
  margin: 0 0 24px;
}

/* ============================================
   PANEL CARD
   ============================================ */
.panel-card {
  background: rgba(17, 24, 39, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 20px;
}

.panel-card-danger {
  border-color: rgba(239, 68, 68, 0.15);
}

/* ============================================
   FORM ELEMENTS
   ============================================ */
.panel-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.panel-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.panel-label {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.5);
}

.panel-input {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s;
  outline: none;
}

.panel-input::placeholder {
  color: rgba(255, 255, 255, 0.2);
}

.panel-input:focus {
  border-color: rgba(71, 139, 224, 0.5);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: 0 0 0 3px rgba(71, 139, 224, 0.1);
}

.panel-select {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  margin-bottom: 16px;
  appearance: none;
}

.panel-select option {
  background: #111827;
  color: #fff;
}

/* ============================================
   BUTTONS
   ============================================ */
.panel-btn-primary {
  padding: 12px 24px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  box-shadow: 0 4px 12px rgba(71, 139, 224, 0.25);
}

.panel-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(71, 139, 224, 0.35);
}

.panel-btn-danger {
  width: 100%;
  padding: 12px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.panel-btn-danger:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: rgba(239, 68, 68, 0.3);
}

/* ============================================
   MESSAGES
   ============================================ */
.panel-message {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 500;
}

.panel-message-success {
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.2);
  color: #4ade80;
}

.panel-message-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
}

/* ============================================
   DANGER ZONE
   ============================================ */
.panel-danger-title {
  font-size: 1rem;
  font-weight: 700;
  color: #f87171;
  margin: 0 0 6px;
}

.panel-danger-desc {
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.4);
  margin: 0 0 16px;
}

/* ============================================
   CONFIRM BOX (used by AccountInfoPage, HistoryPage)
   ============================================ */
.panel-confirm-box {
  margin-top: 12px;
  padding: 16px;
  background: rgba(239, 68, 68, 0.06);
  border: 1px solid rgba(239, 68, 68, 0.18);
  border-radius: 12px;
}

.panel-confirm-text {
  font-size: 13.5px;
  color: rgba(255, 255, 255, 0.65);
  margin: 0 0 14px;
  line-height: 1.5;
}

.panel-confirm-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.panel-btn-secondary {
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.65);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.panel-btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

/* ============================================
   HISTORY LIST (used by HistoryPage)
   ============================================ */
.history-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.history-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  color: #fff;
  font-size: 14px;
  transition: all 0.15s;
}

.history-list li:hover {
  background: rgba(71, 139, 224, 0.08);
  border-color: rgba(71, 139, 224, 0.2);
}

.history-list li span {
  font-size: 13px;
  color: #ef4444;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.2s;
}

.history-list li span:hover {
  opacity: 1;
}

/* Legacy class support */
.section-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: #fff;
  margin: 0 0 16px;
  letter-spacing: -0.01em;
}

.form-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.update-btn {
  padding: 12px 24px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(71, 139, 224, 0.25);
}

.update-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(71, 139, 224, 0.35);
}

.delete-section {
  margin-top: 20px;
}

.delete-section button {
  width: 100%;
  padding: 12px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.delete-section button:hover {
  background: rgba(239, 68, 68, 0.2);
}

.message {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 500;
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.2);
  color: #4ade80;
}

/* Legacy wrapper support */
.user-panel-wrapper {
  display: flex;
  min-height: 100vh;
  background: #000212;
  padding-top: 80px;
}

.user-sidebar {
  width: 260px;
  flex-shrink: 0;
  padding: 24px 16px;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(17, 24, 39, 0.3);
}

.user-sidebar h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
  padding: 0 14px;
}

.user-sidebar ul {
  list-style: none;
  padding: 0;
}

.user-sidebar ul li {
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  color: rgba(255, 255, 255, 0.5);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s;
  margin-bottom: 2px;
  text-align: left;
}

.user-sidebar ul li:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.04);
}

.user-panel {
  flex: 1 1;
  max-width: 700px;
  padding: 32px 40px;
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 768px) {
  .panel-layout,
  .user-panel-wrapper {
    flex-direction: column;
    padding-top: 62px;
  }

  .panel-sidebar,
  .user-sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding: 16px 16px 16px;
  }

  .panel-sidebar-nav {
    flex-direction: row;
    overflow-x: auto;
  }

  .panel-sidebar-link {
    white-space: nowrap;
  }

  .panel-main,
  .user-panel {
    padding: 24px 16px;
  }

  .panel-form-grid {
    grid-template-columns: 1fr;
  }

  .history-toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .history-card {
    flex-wrap: wrap;
    row-gap: 10px;
  }

  .history-card-header {
    flex-wrap: wrap;
    row-gap: 6px;
  }
}

@media (max-width: 420px) {
  .history-card {
    padding: 12px;
  }
}

   ADMIN PANEL PAGES - Modern Dark Theme
   ============================================ */

.admin-page {
  min-height: 100vh;
  background: #000212;
  color: #fff;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  position: relative;
}

.admin-bg-gradient {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 50% 40% at 20% 50%, rgba(14, 165, 233, 0.04), transparent 70%);
  pointer-events: none;
}

.admin-layout {
  display: flex;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ============================================
   ADMIN SIDEBAR
   ============================================ */
.admin-sidebar {
  width: 260px;
  flex-shrink: 0;
  padding: 16px 16px 24px;
  border-right: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(17, 24, 39, 0.3);
}

.admin-sidebar-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  margin-bottom: 24px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.04);
  overflow: hidden;
}

.admin-sidebar-avatar {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0EA5E9, #0284C7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.admin-sidebar-info {
  min-width: 0;
  flex: 1 1;
}

.admin-sidebar-name {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.admin-sidebar-role {
  font-size: 12px;
  color: rgba(14, 165, 233, 0.7);
  margin: 2px 0 0;
  font-weight: 500;
}

.admin-sidebar-email {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.35);
  margin: 2px 0 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.admin-sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.admin-sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 14px;
  background: none;
  border: none;
  border-radius: 10px;
  color: rgba(255, 255, 255, 0.5);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
}

.admin-sidebar-link:hover {
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.04);
}

.admin-sidebar-link-active {
  color: #fff;
  background: rgba(14, 165, 233, 0.12);
}

.admin-sidebar-link svg {
  opacity: 0.6;
  flex-shrink: 0;
}

.admin-sidebar-link-active svg {
  opacity: 1;
  color: #0EA5E9;
}

/* ============================================
   ADMIN MAIN CONTENT
   ============================================ */
.admin-main {
  flex: 1 1;
  padding: 90px 40px 32px;
  max-width: 900px;
}

.admin-main-wide {
  max-width: 1100px;
}

.admin-heading {
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
  margin: 0 0 4px;
  letter-spacing: -0.02em;
}

.admin-subheading {
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.4);
  margin: 0 0 24px;
}

/* ============================================
   ADMIN CARD
   ============================================ */
.admin-card {
  background: rgba(17, 24, 39, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 20px;
}

.admin-card-danger {
  border-color: rgba(239, 68, 68, 0.15);
}

/* ============================================
   ADMIN FORM ELEMENTS
   ============================================ */
.admin-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.admin-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.admin-label {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.5);
}

.admin-input {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s;
  outline: none;
  box-sizing: border-box;
}

.admin-input::placeholder {
  color: rgba(255, 255, 255, 0.2);
}

.admin-input:focus {
  border-color: rgba(14, 165, 233, 0.5);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
}

.admin-select {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  appearance: none;
  box-sizing: border-box;
}

.admin-select option {
  background: #111827;
  color: #fff;
}

/* ============================================
   ADMIN BUTTONS
   ============================================ */
.admin-btn-primary {
  padding: 12px 24px;
  background: linear-gradient(135deg, #0EA5E9, #0284C7);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
}

.admin-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
}

.admin-btn-danger {
  padding: 12px 24px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.admin-btn-danger:hover {
  background: rgba(239, 68, 68, 0.2);
  border-color: rgba(239, 68, 68, 0.3);
}

.admin-btn-secondary {
  padding: 12px 24px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.7);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.admin-btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

.admin-btn-sm {
  padding: 8px 16px;
  font-size: 13px;
}

/* ============================================
   ADMIN MESSAGES
   ============================================ */
.admin-message {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 500;
}

.admin-message-success {
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.2);
  color: #4ade80;
}

.admin-message-error {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: #f87171;
}

/* ============================================
   ADMIN TABLE
   ============================================ */
.admin-table-wrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.admin-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}

.admin-table th {
  padding: 12px 16px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.4);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  background: rgba(255, 255, 255, 0.02);
}

.admin-table td {
  padding: 10px 16px;
  font-size: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  vertical-align: middle;
}

.admin-table tbody tr {
  transition: background 0.15s;
}

.admin-table tbody tr:hover {
  background: rgba(255, 255, 255, 0.02);
}

.admin-table-input {
  width: 100%;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: all 0.2s;
  box-sizing: border-box;
}

.admin-table-input:focus {
  border-color: rgba(14, 165, 233, 0.5);
  box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.1);
}

.admin-table-select {
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  appearance: none;
}

.admin-table-select option {
  background: #111827;
  color: #fff;
}

/* ============================================
   ADMIN DANGER ZONE
   ============================================ */
.admin-danger-title {
  font-size: 1rem;
  font-weight: 700;
  color: #f87171;
  margin: 0 0 6px;
}

.admin-danger-desc {
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.4);
  margin: 0 0 16px;
}

.admin-confirm-box {
  margin-top: 12px;
  padding: 16px;
  background: rgba(239, 68, 68, 0.06);
  border: 1px solid rgba(239, 68, 68, 0.18);
  border-radius: 12px;
}

.admin-confirm-text {
  font-size: 13.5px;
  color: rgba(255, 255, 255, 0.65);
  margin: 0 0 14px;
  line-height: 1.5;
}

.admin-confirm-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 768px) {
  .admin-layout {
    flex-direction: column;
    padding-top: 62px;
  }

  .admin-sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding: 16px 16px 16px;

   CONTACT PAGE - Recall.ai Design System
   ============================================ */

.contact-page {
  background: #000212;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.contact-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
  mask: radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
  -webkit-mask: radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
  pointer-events: none;
}

.contact-bg-glow {
  position: absolute;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(71,139,224,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.contact-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 520px;
  padding: 100px 20px 60px;
}

/* Header */
.contact-header {
  text-align: center;
  margin-bottom: 28px;
}

.contact-icon-wrap {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: rgba(71,139,224,0.1);
  border: 1px solid rgba(71,139,224,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.contact-title {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}

.contact-subtitle {
  font-size: 14px;
  color: rgba(255,255,255,0.45);
  margin: 0;
}

/* Card */
.contact-card {
  background: rgba(17,24,39,0.5);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 28px;
}

/* Form */
.contact-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.contact-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.contact-label {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.5);
}

.contact-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.contact-input-wrap svg {
  position: absolute;
  left: 14px;
  color: rgba(255,255,255,0.3);
  pointer-events: none;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 12px 14px 12px 42px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
  box-sizing: border-box;
}

.contact-form textarea {
  padding-left: 14px;
  min-height: 120px;
  resize: vertical;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder {
  color: rgba(255,255,255,0.25);
}

.contact-form input:focus,
.contact-form textarea:focus {
  border-color: rgba(71,139,224,0.4);
  background: rgba(255,255,255,0.06);
}

.contact-submit {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 2px 10px rgba(71,139,224,0.25);
  transition: all 0.2s;
  margin-top: 4px;
}

.contact-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(71,139,224,0.35);
}

/* Success message */
.contact-success {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.15);
  border-radius: 12px;
  color: #22c55e;
  font-size: 14px;
}

@media (max-width: 600px) {
  .contact-container {
    padding: 90px 16px 40px;
  }

  .contact-card {
    padding: 20px;
  }
}

   ABOUT PAGE - Recall.ai Design System
   ============================================ */

.about-page {
  background: #000212;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}

.about-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
  mask: radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
  -webkit-mask: radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
  pointer-events: none;
}

.about-bg-glow {
  position: absolute;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(71,139,224,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.about-container {
  position: relative;
  z-index: 1;
  max-width: 800px;
  margin: 0 auto;
  padding: 100px 20px 60px;
}

/* Header */
.about-header {
  text-align: center;
  margin-bottom: 40px;
}

.about-icon-wrap {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: rgba(71,139,224,0.1);
  border: 1px solid rgba(71,139,224,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.about-title {
  font-size: 32px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}

.about-subtitle {
  font-size: 15px;
  color: rgba(255,255,255,0.45);
  margin: 0;
}

/* Feature cards */
.about-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.about-card {
  background: rgba(17,24,39,0.5);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  padding: 28px;
  transition: border-color 0.2s;
}

.about-card:hover {
  border-color: rgba(71,139,224,0.2);
}

.about-card-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(71,139,224,0.1);
  border: 1px solid rgba(71,139,224,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  color: #478BE0;
}

.about-card h3 {
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  margin: 0 0 10px;
}

.about-card p {
  font-size: 14px;
  line-height: 1.7;
  color: rgba(255,255,255,0.5);
  margin: 0;
}

/* CTA */
.about-cta {
  text-align: center;
  margin-top: 40px;
  padding: 32px;
  background: rgba(71,139,224,0.06);
  border: 1px solid rgba(71,139,224,0.1);
  border-radius: 16px;
}

.about-cta p {
  color: rgba(255,255,255,0.6);
  font-size: 15px;
  margin: 0 0 16px;
}

.about-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
  box-shadow: 0 2px 10px rgba(71,139,224,0.25);
  transition: all 0.2s;
}

.about-cta-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(71,139,224,0.35);
}

@media (max-width: 600px) {
  .about-container {
    padding: 90px 16px 40px;
  }

  .about-title {
    font-size: 26px;
  }

  .about-card {
    padding: 20px;
  }
}

   Assistant Widget — Floating Chatbot
   ============================================ */

/* Floating Icon Container */
.assistant-fab {
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 9999;
  cursor: pointer;
}

.assistant-fab-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #478BE0, #38BDF8);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(56, 189, 248, 0.4);
  box-shadow: 0 6px 25px rgba(71, 139, 224, 0.5),
              0 0 0 1px rgba(56, 189, 248, 0.3);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
}

.assistant-fab-btn svg {
  width: 32px;
  height: 32px;
  color: #fff;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
}

/* Breathing glow animation when closed */
.assistant-fab-btn--breathing {
  animation: breathe 3.5s infinite ease-in-out;
}

@keyframes breathe {
  0%, 100% {
    box-shadow: 0 4px 20px rgba(71, 139, 224, 0.4),
                0 0 0 1px rgba(56, 189, 248, 0.2);
  }
  50% {
    box-shadow: 0 6px 35px rgba(71, 139, 224, 0.7),
                0 0 40px rgba(56, 189, 248, 0.15),
                0 0 0 1px rgba(56, 189, 248, 0.4);
  }
}

/* Orbiting spark */
.assistant-orbit-spark {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 6px;
  height: 6px;
  margin: -3px 0 0 -3px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.6);
  animation: orbit 8s infinite linear;
  pointer-events: none;
  z-index: 2;
}

@keyframes orbit {
  0%   { transform: rotate(0deg)   translateX(36px) rotate(0deg); }
  100% { transform: rotate(360deg) translateX(36px) rotate(-360deg); }
}

/* Hover ripple ring */
.assistant-fab-btn::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid rgba(71, 139, 224, 0.3);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.3s ease;
  pointer-events: none;
}

.assistant-fab:hover .assistant-fab-btn::after {
  opacity: 1;
  transform: scale(1);
}

/* Hover effect */
.assistant-fab:hover .assistant-fab-btn {
  transform: scale(1.08);
  box-shadow: 0 8px 35px rgba(71, 139, 224, 0.7),
              0 0 50px rgba(56, 189, 248, 0.3),
              0 0 0 2px rgba(56, 189, 248, 0.5);
}

.assistant-fab:active .assistant-fab-btn {
  transform: scale(1.02);
}

/* Notification dot */
.assistant-notification-dot {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 14px;
  height: 14px;
  background: #ef4444;
  border-radius: 50%;
  border: 2px solid #000212;
  z-index: 1;
}

.assistant-notification-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid #ef4444;
  animation: assistantPulse 2s infinite ease-in-out;
}

@keyframes assistantPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.6); opacity: 0; }
}

/* ============================================
   Chat Panel
   ============================================ */

.assistant-panel {
  position: fixed;
  bottom: 110px;
  right: 30px;
  width: 400px;
  height: 520px;
  background: rgba(0, 2, 18, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(71, 139, 224, 0.15);
  border-radius: 20px;
  z-index: 9998;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
              0 0 40px rgba(71, 139, 224, 0.1);

  /* Entry animation */
  animation: panelSlideIn 0.3s ease-out;
}

@keyframes panelSlideIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Header */
.assistant-header {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.assistant-header-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.assistant-header-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.01em;
  margin: 0;
}

.assistant-header-subtitle {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.35);
  font-weight: 500;
  margin: 0;
}

.assistant-close-btn {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: none;
  color: rgba(255, 255, 255, 0.4);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.assistant-close-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
}

/* Messages Area */
.assistant-messages {
  flex: 1 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Custom scrollbar */
.assistant-messages::-webkit-scrollbar {
  width: 4px;
}

.assistant-messages::-webkit-scrollbar-track {
  background: transparent;
}

.assistant-messages::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
}

.assistant-messages::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* Message bubbles */
.assistant-msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.6;
  animation: msgFadeIn 0.3s ease-out;
}

@keyframes msgFadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.assistant-msg--bot {
  align-self: flex-start;
  background: rgba(71, 139, 224, 0.08);
  border: 1px solid rgba(71, 139, 224, 0.1);
  color: rgba(255, 255, 255, 0.8);
  border-bottom-left-radius: 4px;
}

.assistant-msg--user {
  align-self: flex-end;
  background: linear-gradient(135deg, #478BE0, #2F61A0);
  color: #fff;
  border-bottom-right-radius: 4px;
}

/* Bold text in bot messages */
.assistant-msg--bot strong {
  color: #8ecaff;
  font-weight: 600;
}

/* Typing indicator */
.assistant-typing {
  align-self: flex-start;
  display: flex;
  gap: 5px;
  padding: 14px 18px;
  background: rgba(71, 139, 224, 0.08);
  border: 1px solid rgba(71, 139, 224, 0.1);
  border-radius: 16px;
  border-bottom-left-radius: 4px;
}

.assistant-typing-dot {
  width: 7px;
  height: 7px;
  background: rgba(71, 139, 224, 0.5);
  border-radius: 50%;
  animation: typingBounce 1.4s infinite ease-in-out;
}

.assistant-typing-dot:nth-child(2) {
  animation-delay: 0.15s;
}

.assistant-typing-dot:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* Quick Reply Area */
.assistant-replies {
  padding: 12px 20px 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  flex-shrink: 0;
}

.assistant-reply-btn {
  padding: 8px 14px;
  background: rgba(71, 139, 224, 0.06);
  border: 1px solid rgba(71, 139, 224, 0.2);
  border-radius: 9999px;
  color: #58adff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}

.assistant-reply-btn:hover {
  background: rgba(71, 139, 224, 0.15);
  border-color: rgba(71, 139, 224, 0.4);
  color: #8ecaff;
  transform: translateY(-1px);
}

.assistant-reply-btn:active {
  transform: translateY(0);
}

   Responsive
   ============================================ */

@media (max-width: 480px) {
  .assistant-fab {
    bottom: 20px;
    right: 20px;
  }

  .assistant-fab-btn {
    width: 50px;
    height: 50px;

  .assistant-fab-btn svg {
    width: 26px;
    height: 26px;
  }

  .assistant-panel {

    height: 70vh;

  }

  .assistant-notification-dot {
    width: 12px;
    height: 12px;
  }

  .assistant-orbit-spark {
